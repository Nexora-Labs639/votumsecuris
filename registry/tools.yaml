version: 1
tools:
  - name: read_file
    desc: 读取本地文件
    params: [path]
    risk: low
    undo: null
    requires_approval: false

  - name: write_file
    desc: 写入本地文件
    params: [path, content]
    risk: medium
    undo: delete_file
    requires_approval: false

  - name: delete_file
    desc: 删除文件（仅作 write_file 的补偿动作）
    params: [path]
    risk: medium
    undo: null
    requires_approval: false

  - name: run_shell
    desc: 执行系统命令
    params: [command]
    risk: high
    undo: null
    requires_approval: true
    
     # ========== Windows-MCP 工具 ========== 
  - name: windows:Click
    desc: 点击屏幕坐标
    params: [x, y]
    risk: high
    undo: null
    requires_approval: true

  - name: windows:Type
    desc: 输入文本
    params: [text]
    risk: high
    undo: null
    requires_approval: true

  - name: windows:App
    desc: 启动应用
    params: [name]
    risk: high
    undo: null
    requires_approval: true

  - name: windows:Wait
    desc: 暂停
    params: [duration]
    risk: low
    undo: null
    requires_approval: false

  - name: windows:Screenshot
    desc: 截图
    params: []
    risk: low
    undo: null
    requires_approval: false

  - name: windows:PowerShell
    desc: PowerShell 命令（禁止）
    params: [command]
    risk: critical
    undo: null
    requires_approval: true